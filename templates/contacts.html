<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Контакты</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body class="d-flex">

  <!-- Левое меню -->
  <aside class="bg-dark text-white p-3" style="width: 250px; height: 100vh;">
    <h4 class="mb-4">Меню</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a href="/" class="nav-link text-white">Главная</a></li>
      <li class="nav-item"><a href="/catalog" class="nav-link text-white">Каталог</a></li>
      <li class="nav-item"><a href="/category" class="nav-link text-white">Категория</a></li>
      <li class="nav-item"><a href="/contacts" class="nav-link text-white active">Контакты</a></li>
    </ul>
  </aside>

  <!-- Контент -->
  <main class="container my-5">
    <h1 class="text-center">Контакты</h1>

    <div class="row">
      <div class="col-md-6">
        <form method="POST" action="/contacts">
          <div class="mb-3">
            <label for="name" class="form-label">Имя</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Введите имя">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Почта</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Введите почту">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Сообщение</label>
            <textarea class="form-control" id="message" name="message" rows="3" placeholder="Введите сообщение"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
      </div>
      <div class="col-md-6">
        <h5>Наши контакты</h5>
        <p>Вы можете связаться с нами через форму или по email: shop@example.com</p>
        <p>Мы стараемся отвечать как можно быстрее!</p>
      </div>
    </div>
  </main>

  <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
